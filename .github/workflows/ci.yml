name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-manifest:
    name: Dependency Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bootstrap pinned vcpkg
        run: |
          mkdir -p "$VCPKG_DOWNLOADS"
          cmake -P cmake/CypherBootstrapVcpkg.cmake

      - name: Resolve approved dependency graph
        run: |
          ./.deps/vcpkg/vcpkg install --dry-run \
            --x-manifest-root=. \
            --x-install-root=out/vcpkg-manifest-check \
            --x-feature=archive-tools \
            --x-feature=asset-import-fallback \
            --x-feature=audio \
            --x-feature=benchmarks \
            --x-feature=compression \
            --x-feature=editor-support \
            --x-feature=image-import \
            --x-feature=math \
            --x-feature=mesh-pipeline \
            --x-feature=networking \
            --x-feature=profiling \
            --x-feature=scripting \
            --x-feature=security \
            --x-feature=shader-tools \
            --x-feature=tests \
            --x-feature=text \
            --x-feature=texture-pipeline

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Debug
            os: ubuntu-latest
            build_type: Debug
          - name: Ubuntu Release
            os: ubuntu-latest
            build_type: Release
          - name: Windows Debug
            os: windows-latest
            build_type: Debug
          - name: Windows Release
            os: windows-latest
            build_type: Release
          - name: macOS Debug
            os: macos-latest
            build_type: Debug
          - name: macOS Release
            os: macos-latest
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool libtool-bin libltdl-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install autoconf autoconf-archive automake libtool
          if ! command -v libtoolize >/dev/null 2>&1 && command -v glibtoolize >/dev/null 2>&1; then
            sudo ln -sf "$(command -v glibtoolize)" /usr/local/bin/libtoolize
          fi

      - name: Bootstrap pinned vcpkg
        run: |
          mkdir -p "$VCPKG_DOWNLOADS"
          cmake -P cmake/CypherBootstrapVcpkg.cmake

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            .vcpkg-downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', '.gitmodules', 'cmake/CypherBootstrapVcpkg.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        run: |
          configure_command=(
            cmake -S . -B build
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
            -DCYPHERENGINE_BUILD_TESTS=ON
            -DVCPKG_MANIFEST_FEATURES=tests
            "-DCMAKE_TOOLCHAIN_FILE=$PWD/.deps/vcpkg/scripts/buildsystems/vcpkg.cmake"
          )
          for attempt in 1 2 3; do
            "${configure_command[@]}" && break
            status=$?
            if [[ "$attempt" == "3" ]]; then
              exit "$status"
            fi
            echo "Configure failed; retrying in $(( attempt * 20 )) seconds..."
            sleep $(( attempt * 20 ))
          done

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --no-tests=error --timeout 120

  linux-sanitizers:
    name: Ubuntu ASan UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool libtool-bin libltdl-dev

      - name: Bootstrap pinned vcpkg
        run: |
          mkdir -p "$VCPKG_DOWNLOADS"
          cmake -P cmake/CypherBootstrapVcpkg.cmake

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            .vcpkg-downloads
          key: vcpkg-${{ runner.os }}-sanitize-${{ hashFiles('vcpkg.json', '.gitmodules', 'cmake/CypherBootstrapVcpkg.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        run: |
          configure_command=(
            cmake -S . -B build-sanitize
            -DCMAKE_BUILD_TYPE=Debug
            -DCYPHERENGINE_BUILD_TESTS=ON
            -DVCPKG_MANIFEST_FEATURES=tests
            "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
            "-DCMAKE_TOOLCHAIN_FILE=$PWD/.deps/vcpkg/scripts/buildsystems/vcpkg.cmake"
          )
          for attempt in 1 2 3; do
            "${configure_command[@]}" && break
            status=$?
            if [[ "$attempt" == "3" ]]; then
              exit "$status"
            fi
            echo "Configure failed; retrying in $(( attempt * 20 )) seconds..."
            sleep $(( attempt * 20 ))
          done

      - name: Build
        run: cmake --build build-sanitize --config Debug --parallel

      - name: Test
        run: ctest --test-dir build-sanitize -C Debug --output-on-failure --no-tests=error --timeout 120

  benchmark-build:
    name: ${{ matrix.name }} Bench Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool libtool-bin libltdl-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install autoconf autoconf-archive automake libtool
          if ! command -v libtoolize >/dev/null 2>&1 && command -v glibtoolize >/dev/null 2>&1; then
            sudo ln -sf "$(command -v glibtoolize)" /usr/local/bin/libtoolize
          fi

      - name: Bootstrap pinned vcpkg
        run: |
          mkdir -p "$VCPKG_DOWNLOADS"
          cmake -P cmake/CypherBootstrapVcpkg.cmake

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            .vcpkg-downloads
          key: vcpkg-${{ runner.os }}-bench-${{ hashFiles('vcpkg.json', '.gitmodules', 'cmake/CypherBootstrapVcpkg.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure benchmarks
        run: |
          configure_command=(
            cmake -S . -B build-bench
            -DCMAKE_BUILD_TYPE=Release
            -DCYPHERENGINE_BUILD_BENCHMARKS=ON
            -DVCPKG_MANIFEST_FEATURES=benchmarks
            "-DCMAKE_TOOLCHAIN_FILE=$PWD/.deps/vcpkg/scripts/buildsystems/vcpkg.cmake"
          )
          for attempt in 1 2 3; do
            "${configure_command[@]}" && break
            status=$?
            if [[ "$attempt" == "3" ]]; then
              exit "$status"
            fi
            echo "Configure benchmarks failed; retrying in $(( attempt * 20 )) seconds..."
            sleep $(( attempt * 20 ))
          done

      - name: Build benchmark targets
        run: cmake --build build-bench --config Release --target cypher_common_memoryops_bench cypher_perf_system_report --parallel

      - name: Report benchmark system info
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./build-bench/bin/Release/cypher_perf_system_report.exe
          else
            ./build-bench/bin/cypher_perf_system_report
          fi
